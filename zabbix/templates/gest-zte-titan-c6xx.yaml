            - uuid: c14a8489a19145feab0b1ea080f9f26a
              name: 'ONUs não online (todos os estados): {#OLTGPON}'
              type: CALCULATED
              key: 'zte.onu.notonline[{#SNMPINDEX}]'
              delay: 30s
              history: 7d
              params: 'last(//chave.gpon.zte.autorizadas.b.[{#OLTGPON}])-last(//chave.gpon.zte.onlines.b.[{#OLTGPON}])'
              description: 'Autorizadas menos online. Inclui LOS, energia e demais estados; não equivale apenas ao estado 7.'
            - uuid: 8304e80d52dc40c8ae2e09f910814020
              name: 'ONUs OffLine (estado 7): {#OLTGPON}'
              type: DEPENDENT
              key: 'zte.onu.state7[{#SNMPINDEX}]'
              delay: '0'
              history: 7d
              description: 'Conta exatamente o estado 7 do OID ZTE, como o helper original. Falhas de comunicação ficam no item mestre e não são convertidas em zero.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      if (value.indexOf("No Such")>=0 || value.indexOf("INTEGER:")<0) throw "Tabela de ONUs indisponível";
                      var lines = value.split(/\r?\n/), count = 0, seen = 0;
                      var prefix = ".1.3.6.1.4.1.3902.1082.500.10.2.3.8.1.4.{#SNMPINDEX}.";
                      for (var i=0; i<lines.length; i++) {
                       var line=lines[i].trim(); if (line.charAt(0)!==".") line="."+line;
                       if (line.indexOf(prefix)!==0) continue;
                       var m=line.match(/=\s*(?:INTEGER:\s*)?(?:[A-Za-z][\w-]*\()?([0-9]+)\)?\s*$/);
                       if (!m) throw "Estado ONU inválido"; seen++; if(Number(m[1])===7) count++;
                      }
                      return count;
              master_item:
                key: zte.onu.states.walk
              tags:
                - tag: Application
                  value: 'ONUs OFF'
          graph_prototypes:
            - uuid: 2c693a4b81a54464bb329a64b393632a
              name: 'GPON {#OLTGPON}: ONUs autorizadas, online e não online'
              width: '800'
