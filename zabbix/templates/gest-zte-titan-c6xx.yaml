        - uuid: 7248f1354051466aa83f5c417d2af672
          name: 'GPON: dados para o painel por porta'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.8,1.3.6.1.4.1.3902.1082.500.10.2.2.3.1.14,1.3.6.1.4.1.3902.1082.500.10.2.2.3.1.15]'
