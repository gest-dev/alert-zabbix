          history: '0'
          value_type: TEXT
          trends: '0'
          tags:
            - tag: component
              value: dashboard
            - tag: vendor
              value: ZTE
        - uuid: 239d820e9f8047f0ab4a630d23112eb8
          name: 'GPON: total de ONUs autorizadas'
          type: CALCULATED
          key: zte.dashboard.onu.authorized
          delay: 30s
          history: 7d
          trends: 90d
          params: 'sum(last_foreach(//chave.gpon.zte.autorizadas.b.[*]))'
          tags:
            - tag: component
              value: dashboard
            - tag: vendor
              value: ZTE
        - uuid: 5b003d10daad442b9d20d035b7fb2d09
          name: 'GPON: total de ONUs não online'
          type: CALCULATED
          key: zte.dashboard.onu.notonline
          delay: 30s
          history: 7d
          trends: 90d
          params: 'sum(last_foreach(//chave.gpon.zte.autorizadas.b.[*]))-sum(last_foreach(//chave.gpon.zte.onlines.b.[*]))'
          tags:
            - tag: component
              value: dashboard
            - tag: vendor
              value: ZTE
        - uuid: 6f8348e1c6d044d699c397c454d010a9
          name: 'GPON: total de ONUs online'
          type: CALCULATED
          key: zte.dashboard.onu.online
          delay: 30s
          history: 7d
          trends: 90d
          params: 'sum(last_foreach(//chave.gpon.zte.onlines.b.[*]))'
          tags:
            - tag: component
              value: dashboard
            - tag: vendor
              value: ZTE
        - uuid: b61553e2f71c4cf6b522312c1da3a52a
          name: 'GPON: percentual de ONUs online'
          type: CALCULATED
          key: zte.dashboard.onu.online.percent
          delay: 30s
          history: 7d
          value_type: FLOAT
          trends: 90d
          units: '%'
          params: '100*sum(last_foreach(//chave.gpon.zte.onlines.b.[*]))/(sum(last_foreach(//chave.gpon.zte.autorizadas.b.[*]))+(sum(last_foreach(//chave.gpon.zte.autorizadas.b.[*]))=0))'
          tags:
            - tag: component
              value: dashboard
            - tag: vendor
              value: ZTE
        - uuid: 2cc5b0fb08eb4c05ad9da24200b39d8c
          name: 'GPON: total de ONUs OffLine (estado 7)'
          type: CALCULATED
          key: zte.dashboard.onu.state7
