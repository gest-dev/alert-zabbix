zabbix_export:
  version: '6.4'
  template_groups:
    - uuid: e601af49d1d7433fb98d565188559f68
      name: GEST
  templates:
    - uuid: f4cae2af913d49a39802e58486f10a5e
      template: GEST-cpu-hd-uiluolt
      name: GEST-cpu-hd-uiluolt
      description: 'VM uiluolt com base Linux: CPU, memória, discos, rede e uptime. Padrão GEST de disco 90%/95% por três coletas e falha TCP do agente por 1 minuto. Verifica processo e porta uiluolt, MongoDB, PM2, GenieACS e OpenVPN pelo Agent 2. Serviços: 1 minuto de falha e 30 segundos de recuperação. Reaplicar configurar_template_uiluolt.py após importar para ajustar os status herdados. Não usa credenciais de banco.'
      templates:
        - name: 'Linux by Zabbix agent'
      groups:
        - name: GEST
      items:
        - uuid: 20c2dff4d2d1457d8f3d3d3f10054e97
          name: 'Zabbix agent: conexão TCP rápida'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$GEST.AGENT.PORT}]'
          delay: '{$GEST.AGENT.CHECK.INTERVAL}'
          history: 7d
          trends: 90d
          description: 'Servidor/proxy verifica a porta TCP do agente, independentemente da espera do poller de agentes indisponíveis. Confirma conectividade TCP, não a execução das métricas. Abre alerta após 1 minuto de falhas observadas e recupera após 30 segundos de respostas positivas estáveis.'
          valuemap:
            name: 'GEST - Conexão agente TCP'
          tags:
            - tag: component
              value: zabbix-agent
            - tag: scope
              value: availability
          triggers:
            - uuid: 648d71a764ee4cfbbaab9eb32b8410b6
              expression: 'max(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$GEST.AGENT.PORT}],1m)=0 and last(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$GEST.AGENT.PORT}],#1:now-1m)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$GEST.AGENT.PORT}],30s)=1 and last(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$GEST.AGENT.PORT}],#1:now-30s)=1'
              name: '{HOST.NAME}: conexão com o agente Zabbix indisponível'
              opdata: 'Conexão TCP: {ITEM.LASTVALUE1}'
              priority: AVERAGE
              description: 'Confirma falha TCP por 1 minuto e recuperação por 30 segundos, com coleta padrão a cada 5 segundos. O valor no início de cada janela também é conferido para não confirmar estabilidade com uma única amostra após intervalo sem coleta. Timeout, processamento e entrega do mensageiro podem acrescentar atraso.'
              tags:
                - tag: component
                  value: zabbix-agent
                - tag: scope
                  value: availability
        - uuid: 8f5c45eb92f0448e810842a39a0486a6
          name: 'uiluolt: porta da aplicação'
          type: SIMPLE
          key: 'net.tcp.service[tcp,,{$UILUOLT.APP.PORT}]'
          delay: '{$UILUOLT.INTERVAL}'
          history: 7d
          trends: 90d
          valuemap:
            name: 'GEST - Serviço disponível'
          tags:
            - tag: application
              value: uiluolt
            - tag: component
              value: service
          triggers:
            - uuid: 3fab3e0469714a47bb21bda583ea6ccc
              expression: 'max(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$UILUOLT.APP.PORT}],1m)=0 and last(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$UILUOLT.APP.PORT}],#1:now-1m)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$UILUOLT.APP.PORT}],30s)>=1 and last(/GEST-cpu-hd-uiluolt/net.tcp.service[tcp,,{$UILUOLT.APP.PORT}],#1:now-30s)>=1'
              name: '{HOST.NAME}: uiluolt: porta da aplicação indisponível'
              priority: HIGH
              description: 'Falha contínua por 1 minuto, recuperação após 30 segundos estáveis. As expressões conferem também o início da janela para evitar confirmação com poucas amostras. Porta e processo não confirmam operações internas da aplicação.'
              tags:
                - tag: application
                  value: uiluolt
                - tag: component
                  value: service
        - uuid: c4616a0e570b47928b158aaea6c164c9
          name: 'MongoDB: porta local'
