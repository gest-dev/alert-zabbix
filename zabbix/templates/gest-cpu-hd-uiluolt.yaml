        - macro: '{$UILUOLT.INTERVAL}'
          value: 15s
          description: 'Intervalo das verificações dos serviços.'
        - macro: '{$UILUOLT.MONGODB.PORT}'
          value: '27017'
          description: 'Porta MongoDB consultada localmente pelo agente.'
        - macro: '{$UILUOLT.PROCESS.MATCHES}'
          value: /root/uiluolt/build/bin/server\.js
          description: 'Expressão regular do processo da aplicação, sem considerar outros processos Node.js.'
        - macro: '{$UILUOLT.SERVICE.GENIEACS.CWMP}'
